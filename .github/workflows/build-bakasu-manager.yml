# ============================================================================
# 构建 BakaSU(原 ReSukiSU) Manager APK —— 自包含版
#
# 用途: BakaSU 官方 main 分支没有发布 APK (最新 release 仍是 v4.2.0-rc3,
#       UAPI v4; 而内核侧已升到 main / UAPI v6), 本 workflow 直接在云上编译。
#
# 与官方 .github/workflows/build-manager.yml 的区别:
#   - 官方用的是仓库自身 checkout + secrets 签名; 这里 clone 官方仓库到子目录,
#     用本仓库 manager-signing/ 下的固定 keystore 签名 (签名不随构建变化,
#     可以覆盖安装, 不需要每次卸载重装)。
#   - 版本号由 git tag 控制: 本 workflow 会在源码 HEAD 上打 tag `<version_name>`,
#     于是 managerVersionName = getGitDescribe() = 该 tag,
#     managerVersionCode = 30000 + git rev-list --count HEAD + 700。
#
# ★ versionCode 必须 >= 35171 才能覆盖安装官方 v4.2.0-rc3
#   (rc3 资产名 ReSukiSU_v4.2.0-rc3_35171-arm64-v8a-release.apk)。
#   rc3 的 commit 数为 4471 (30000+4471+700=35171); main 更靠后, 所以正常满足。
#   若日志里打印的 versionCode 小于 35171, 说明 clone 的历史被截断, 需要
#   去掉 --filter=blob:none 或改 fetch-depth。
#
# ★ 包名: 默认 com.resukisu.resukisu, 与官方/旧版完全相同 -> 直接覆盖安装。
#   勾选 package_suffix (如 .dev) 则装成独立应用, 可与旧版共存。
#
# ★ 签名密钥: manager-signing/bakasu-manager.jks (PKCS12, 别名 bakasu)。
#   密码明文写在下方 env 里 —— 这是**有意为之**(本仓库为个人自用公开仓库,
#   密钥泄漏的后果仅限"别人能签出同签名的 BakaSU"), 换取构建可完全复现。
#   官方仓库的 PR 构建用一次性随机 keystore, 这也是为什么官方 PR 产物
#   每次签名都不同、装一次要卸载一次。
# ============================================================================
name: Build BakaSU Manager

on:
  workflow_dispatch:
    inputs:
      bakasu_ref:
        description: 'BakaSU 源码版本 (commit SHA / tag / 分支)。默认 548d1dda = main (2026-11-09, UAPI v6)。⚠ 55_/57_/58_ 补丁按此版本的行号锚点生成，换 commit 前先重做补丁。'
        required: false
        type: string
        default: '548d1dda060ca198823d8808804d01f5209ef4a9'
      version_name:
        description: '版本名 (会作为 git tag 打在源码上, 决定 APK 的 versionName)。按 v4.2.0 / v4.3.0 这种格式填。'
        required: false
        type: string
        default: 'v4.3.0'
      package_suffix:
        description: '包名后缀。留空 = com.resukisu.resukisu (覆盖旧管理器); 填 .dev = com.resukisu.resukisu.dev (与旧版共存)。'
        required: false
        type: string
        default: ''
      build_debug:
        description: '同时构建 debug 版 (未签名优化, 仅排查问题用)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  KEYSTORE_FILE_NAME: 'bakasu-manager.jks'
  KEYSTORE_ALIAS: 'bakasu'
  KEYSTORE_PASSWORD: 'bakasu-oscarc-lto24'
  BAKASU_REPO: 'https://github.com/Baka-SU/BakaSU.git'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (只取签名密钥)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: self

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # ---------------------------------------------------------------- 源码
      - name: Clone BakaSU (保留完整提交历史, 版本号需要 rev-list --count)
        run: |
          set -euo pipefail
          # --filter=blob:none: 保留全部 commit/tree, 只按需拉 blob
          # -> git rev-list --count HEAD 得到真实提交数 (rc3 = 4471)
          git clone --filter=blob:none --no-checkout "$BAKASU_REPO" bakasu
          cd bakasu
          git checkout --detach "${{ inputs.bakasu_ref }}"

      - name: 打 tag 固定版本名
        working-directory: bakasu
        run: |
          set -euo pipefail
          git tag -f "${{ inputs.version_name }}" HEAD
          echo "tag $(git describe --tags --always --abbrev=0) @ $(git rev-parse --short HEAD)"
          echo "commit count = $(git rev-list --count HEAD)"

      - name: 预演版本号 (versionCode 必须 >= 35171)
        working-directory: bakasu
        run: |
          set -euo pipefail
          COUNT=$(git rev-list --count HEAD)
          NAME=$(git describe --tags --always --abbrev=0)
          CODE=$((30000 + COUNT + 700))
          echo "managerVersionName = $NAME"
          echo "managerVersionCode = $CODE   (官方 rc3 = 35171)"
          {
            echo "### BakaSU Manager 本次版本"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 源码 | \`${{ inputs.bakasu_ref }}\` |"
            echo "| 短 SHA | \`$(git rev-parse --short=12 HEAD)\` |"
            echo "| 提交数 | $COUNT |"
            echo "| versionName | **$NAME** |"
            echo "| versionCode | **$CODE** |"
            echo "| 包名 | \`com.resukisu.resukisu${{ inputs.package_suffix }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" -lt 35171 ]; then
            echo "::warning::versionCode $CODE < 35171，无法覆盖安装官方 v4.2.0-rc3"
          fi

      # ---------------------------------------------------------------- 签名
      - name: 安装签名配置
        run: |
          set -euo pipefail
          cp "self/manager-signing/$KEYSTORE_FILE_NAME" "bakasu/manager/$KEYSTORE_FILE_NAME"
          cat >> bakasu/manager/gradle.properties <<EOF

          # ---- 由 build-bakasu-manager.yml 注入 (lsplugin.apksign 读取) ----
          KEYSTORE_FILE=$KEYSTORE_FILE_NAME
          KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD
          KEY_ALIAS=$KEYSTORE_ALIAS
          KEY_PASSWORD=$KEYSTORE_PASSWORD
          EOF
          keytool -list -keystore "bakasu/manager/$KEYSTORE_FILE_NAME" -storepass "$KEYSTORE_PASSWORD" | head -6

      # ---------------------------------------------------------------- 构建
      - name: Build release APK
        working-directory: bakasu/manager
        env:
          KSU_PACKAGE_NAME: com.resukisu.resukisu${{ inputs.package_suffix }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "$KSU_PACKAGE_NAME" ] && [ "$KSU_PACKAGE_NAME" != "com.resukisu.resukisu" ]; then
            ARGS="-PKSU_PACKAGE_NAME=$KSU_PACKAGE_NAME"
          fi
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease $ARGS
          echo "--- 产物 ---"
          find app/build/outputs/apk -name '*.apk' -printf '%p  %s bytes\n'

      # ------------------------------------------------- BakaSU ksud (Rust)
      # 官方 build-manager.yml 是三阶段: build-manager -> build-ksud -> repack-manager。
      # 只 assembleRelease 得到的 APK 不含 ksud, 装上后会抛
      #   IllegalArgumentException: libksud.so was not found in the application native library path
      - name: Setup Rust (nightly + aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: aarch64-linux-android
          components: rust-src

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build ksud (arm64-v8a)
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          test -d "$ANDROID_NDK_HOME"
          clang --target=aarch64-linux-gnu -c -nostdlib \
            -o bakasu/userspace/ksud/.lkm_image_bootstrap.o \
            bakasu/userspace/ksud/src/lkm_image_bootstrap.S
          cd bakasu/userspace/ksud
          cargo ndk b -P 26 -t aarch64-linux-android -r \
            -Z build-std-features="optimize_for_size" -Z trim-paths
          echo "--- ksud ---"
          ls -l target/aarch64-linux-android/release/ksud
          file target/aarch64-linux-android/release/ksud || true

      - name: Repack APK (注入 lib/arm64-v8a/libksud.so 并重签)
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)"
          mkdir -p bakasu/target/aarch64-linux-android/release
          cp -f bakasu/userspace/ksud/target/aarch64-linux-android/release/ksud \
                bakasu/target/aarch64-linux-android/release/ksud
          cd bakasu
          python3 repack_apk_multi.py repack \
            -b release -t release -a arm64-v8a \
            -K "manager/$KEYSTORE_FILE_NAME" -A "$KEYSTORE_ALIAS" \
            -P "$KEYSTORE_PASSWORD" -S "$KEYSTORE_PASSWORD" \
            --strip
          echo "--- repack 产物 ---"
          ls -l dist/
          APK="$(ls dist/*.apk | head -1)"
          echo "检查 $APK 是否含 libksud.so"
          unzip -l "$APK" | grep -E 'libksud\.so' || { echo "FAIL: libksud.so missing"; exit 1; }

      - name: Build debug APK
        if: ${{ inputs.build_debug }}
        working-directory: bakasu/manager
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      # ---------------------------------------------------------------- 产物
      - name: 校验签名
        run: |
          set -euo pipefail
          APK=$(find bakasu/dist -name '*arm64-v8a*.apk' | head -1)
          [ -n "$APK" ] || APK=$(find bakasu/dist -name '*.apk' | head -1)
          echo "检查 $APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          "${BUILD_TOOLS}apksigner" verify --print-certs "$APK" | head -8 || true

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: BakaSU-Manager-release-${{ inputs.version_name }}
          path: bakasu/dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload debug APK
        if: ${{ inputs.build_debug }}
        uses: actions/upload-artifact@v7
        with:
          name: BakaSU-Manager-debug-${{ inputs.version_name }}
          path: bakasu/manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload mapping
        uses: actions/upload-artifact@v7
        with:
          name: BakaSU-Manager-mapping-${{ inputs.version_name }}
          path: bakasu/manager/app/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 30
